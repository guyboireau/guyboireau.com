name: Secret Scan

# Détecte tout secret (clé d'API, token, clé privée) présent dans le code OU dans
# l'historique Git, avant qu'il n'atteigne main. Créé suite à l'audit du 2026-09-07.
#
# Les faux positifs connus sont listés — et justifiés un par un — dans .gitleaks.toml.
# Si ce job devient rouge : ouvre le fichier signalé, vérifie la valeur. Si c'est un
# vrai secret, RÉVOQUE-LE d'abord, puis purge-le de l'historique. Ne l'ajoute pas
# à l'allowlist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks scanne les commits, pas seulement le
          # working tree. Un secret supprimé dans un commit ultérieur reste
          # exploitable et doit donc être détecté.
          fetch-depth: 0

      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scanner l'historique Git
        # --redact : ne jamais imprimer la valeur d'un secret dans les logs CI,
        # qui sont conservés et consultables. Le rapport donne fichier + ligne,
        # ce qui suffit à localiser la fuite.
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --no-banner
