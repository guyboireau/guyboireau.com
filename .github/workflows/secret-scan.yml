name: Secret Scan

# Détection de secrets commités (clés API, tokens, JWT service_role…).
#  - Sur PR   : scan des seuls commits de la branche (retour rapide).
#  - Sur main : scan de l'historique complet.
#  - Chaque lundi : audit complet planifié, pour rattraper un secret
#    introduit par un push direct ou révélé par une nouvelle règle.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # lundi 06:00 UTC
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.28.0'
  GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'

jobs:
  gitleaks:
    name: 🔐 Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis par gitleaks

      # Le binaire officiel est utilisé plutôt que l'action `gitleaks-action`,
      # qui exige une licence payante pour les dépôts d'organisation.
      # Le checksum est vérifié pour se prémunir d'une release altérée.
      - name: Installer gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Garde-fou complémentaire : gitleaks inspecte le CONTENU, cette étape
      # inspecte les NOMS de fichiers. Un .env ou un keystore peut être commité
      # sans qu'aucune de ses lignes ne ressemble à un secret connu.
      #
      # Exception assumée : `android/app/debug.keystore`. C'est le keystore de
      # debug généré par `expo prebuild`, référencé en dur par
      # `android/app/build.gradle` (storeFile file('debug.keystore')). Son mot
      # de passe est la constante publique `android` : il ne signe que des
      # builds de debug et ne présente aucun risque. Le retirer casserait
      # `gradlew assembleDebug` sur tout nouveau clone. Un keystore de RELEASE
      # à un autre emplacement reste, lui, bien bloqué.
      - name: Vérifier qu'aucun fichier sensible n'est suivi
        run: |
          set -uo pipefail
          tracked=$(git ls-files \
            | grep -EI '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|jks|keystore|mobileprovision)$|(^|/)(credentials|service-account[^/]*)\.json$' \
            | grep -v '\.example$' \
            | grep -v '^android/app/debug\.keystore$' || true)
          if [ -n "$tracked" ]; then
            echo "⛔ Fichier(s) sensible(s) suivi(s) par git :"
            echo "$tracked" | sed 's/^/   - /'
            echo ""
            echo "   Corriger avec : git rm --cached <fichier> puis ajouter au .gitignore"
            exit 1
          fi
          echo "✅ Aucun fichier sensible suivi."

      # --redact garantit qu'aucune valeur de secret n'atterrit dans les logs
      # publics du run ni dans le rapport archivé.
      - name: Scanner l'historique
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            echo "Scan des commits de la PR : $range"
            gitleaks git . --log-opts="$range" --redact --no-banner \
              --report-format sarif --report-path gitleaks.sarif
          else
            echo "Scan de l'historique complet"
            gitleaks git . --redact --no-banner \
              --report-format sarif --report-path gitleaks.sarif
          fi
          echo "✅ Aucun secret détecté."

      - name: Archiver le rapport
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
          if-no-files-found: ignore
