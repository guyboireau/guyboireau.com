name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type check
        run: npm run lint
        # Note: lint script runs `astro check && eslint .`
        # astro check covers TypeScript type checking for Astro components

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://mock-url.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
