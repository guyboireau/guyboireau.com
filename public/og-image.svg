<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="-50" cy="-50" r="300" fill="#ff6b35" opacity="0.06"/>
  <circle cx="1250" cy="680" r="300" fill="#ff6b35" opacity="0.06"/>

  <!-- Orange accent bar -->
  <rect x="80" y="200" width="6" height="120" rx="3" fill="url(#orange)"/>

  <!-- Name -->
  <text x="110" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="white">Guy Boireau</text>

  <!-- Title -->
  <text x="110" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#fb923c">Développeur Web Freelance · Bordeaux</text>

  <!-- Stack tags -->
  <rect x="110" y="380" width="130" height="40" rx="20" fill="#ff6b3520" stroke="#ff6b35" stroke-width="1"/>
  <text x="175" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fb923c">React</text>

  <rect x="255" y="380" width="160" height="40" rx="20" fill="#ff6b3520" stroke="#ff6b35" stroke-width="1"/>
  <text x="335" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fb923c">TypeScript</text>

  <rect x="430" y="380" width="150" height="40" rx="20" fill="#ff6b3520" stroke="#ff6b35" stroke-width="1"/>
  <text x="505" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fb923c">NestJS</text>

  <rect x="595" y="380" width="190" height="40" rx="20" fill="#ff6b3520" stroke="#ff6b35" stroke-width="1"/>
  <text x="690" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fb923c">React Native</text>

  <!-- Domain -->
  <text x="110" y="530" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">guyboireau.com</text>

  <!-- Available badge -->
  <circle cx="820" cy="525" r="8" fill="#4ade80"/>
  <text x="840" y="531" font-family="system-ui, sans-serif" font-size="22" fill="#4ade80">Disponible pour de nouveaux projets</text>
</svg>
